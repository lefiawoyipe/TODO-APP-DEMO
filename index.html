<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO APP DEMO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app"><h2>To-Do List <img src= "images/icon.png"></h2>
    <div class="row">
    <input type="text" id="input-box" placeholder="Add task..." aria-label="Task input" />
    <button onclick="addTask()">Add</button>
    <button onclick="clearAll()">Clear All</button>
    <button onclick="clearCompleted()">Clear Completed</button>
    </div>
    <ul id="list-container" role="list" aria-label="Task list"></ul>
        </div>
</div>
    <script src="actionscript.js"></script>
</body>
</html>
